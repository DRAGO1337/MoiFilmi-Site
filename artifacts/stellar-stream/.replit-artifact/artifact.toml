kind = "web"
previewPath = "/"
title = "Stellar Stream"
description = "A responsive streaming discovery website prototype for browsing and watching films and series that viewers have permission to share."
version = "1.0.0"
id = "artifacts/stellar-stream"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22221

[services.development]
run = "pnpm --filter @workspace/stellar-stream run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stellar-stream", "run", "build" ]
serve = "static"
publicDir = "artifacts/stellar-stream/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22221"
BASE_PATH = "/"
